plugins { id 'com.android.application' }
android {
 namespace 'kr.co.firsthyundai.app'
 compileSdk 35
 defaultConfig { applicationId 'kr.co.firsthyundai.app'; minSdk 26; targetSdk 35; versionCode 94; versionName '2.0.43' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
 implementation 'androidx.core:core:1.13.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
}

/* Release signing requires a stable private key supplied through encrypted CI secrets. */
def fhdStore=System.getenv('FHD_SIGNING_KEYSTORE')
def fhdStorePass=System.getenv('FHD_SIGNING_STORE_PASSWORD')
def fhdAlias=System.getenv('FHD_SIGNING_KEY_ALIAS')
def fhdKeyPass=System.getenv('FHD_SIGNING_KEY_PASSWORD')
if([fhdStore,fhdStorePass,fhdAlias,fhdKeyPass].every{it}) {
 android.signingConfigs {
  fhdProduction {
   storeFile file(fhdStore)
   storePassword fhdStorePass
   keyAlias fhdAlias
   keyPassword fhdKeyPass
  }
 }
 android.buildTypes.release.signingConfig=android.signingConfigs.fhdProduction
}
