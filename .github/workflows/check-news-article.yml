name: Check Google News Article Resolution
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-news-article.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Google News RSS link without third-party credentials
        env:
          NEWS_LINK: "https://news.google.com/rss/articles/CBMiYkFVX3lxTE1MNEdUc3VXNkcxU0FFQ1BlSHA5Z0MzNHNDbFdJRkpZV3prOG1HNVNHYmM2QXllcHdoQUxqeEdXeVRTSUxCQ3pITW5RdVRDbDRKUlVvVU5MU0Rucm1GZ0dvaDFB?oc=5"
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.parse import urlparse
          from html.parser import HTMLParser
          import os
          req=Request(os.environ["NEWS_LINK"],headers={"User-Agent":"Mozilla/5.0","Accept":"text/html"})
          with urlopen(req,timeout=20) as r:
              html=r.read(400000).decode("utf-8",errors="replace")
              print("Final host:",urlparse(r.url).hostname,"size:",len(html),"status:",r.status)
              print("Indicators:",{p:(p in html) for p in ['data-p=','data-n-a-sg','data-n-a-ts','garturlreq','batchexecute','<article']})
              class Wiz(HTMLParser):
                  found=[]
                  def handle_starttag(self,tag,attrs):
                      if tag=="c-wiz":
                          d=dict(attrs)
                          if 'data-p' in d:self.found.append(len(d['data-p']))
              v=Wiz();v.feed(html)
              print("Wiz payload lengths:",v.found[:4])
          PY
      - name: Try pinned Google News article URL decoder
        env:
          NEWS_LINK: ${{ github.event.repository.html_url }}
        run: |
          printf 'gnews-decoder==0.1.1 --hash=sha256:2d591a6bbb70eade4d1e6da3bc6660294ef6d394119f26283df1d1d7df97796c\n' > /tmp/gnews-hashes.txt
          python3 -m pip install --no-deps --only-binary=:all: --require-hashes -r /tmp/gnews-hashes.txt
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit
          from gnews_decoder import decode_many
          url="https://news.google.com/rss/articles/CBMiYkFVX3lxTE1MNEdUc3VXNkcxU0FFQ1BlSHA5Z0MzNHNDbFdJRkpZV3prOG1HNVNHYmM2QXllcHdoQUxqeEdXeVRTSUxCQ3pITW5RdVRDbDRKUlVvVU5MU0Rucm1GZ0dvaDFB?oc=5"
          try:
              result=decode_many([url],timeout=12,concurrency=1)
              decoded=result.get(url)
              print("Decoder final host:",urlsplit(decoded or "").hostname if decoded else "none")
              print("Decoding worked:",bool(decoded and urlsplit(decoded).hostname!="news.google.com"))
          except Exception as exc:
              print("Decoder exception:",type(exc).__name__)
          PY
      - uses: actions/checkout@v4
      - name: Check resolved publisher body without storing copyrighted text
        run: |
          python3 - <<'PY'
          import sys
          from urllib.parse import urlsplit
          from gnews_decoder import decode
          sys.path.insert(0,"scripts")
          from summarize_news import read_article
          url="https://news.google.com/rss/articles/CBMiYkFVX3lxTE1MNEdUc3VXNkcxU0FFQ1BlSHA5Z0MzNHNDbFdJRkpZV3prOG1HNVNHYmM2QXllcHdoQUxqeEdXeVRTSUxCQ3pITW5RdVRDbDRKUlVvVU5MU0Rucm1GZ0dvaDFB?oc=5"
          original=decode(url,timeout=10)
          print("Resolved host:",urlsplit(original or "").hostname)
          if original:
              body=read_article(original)
              print("Readable article characters:",len(body))
          PY
