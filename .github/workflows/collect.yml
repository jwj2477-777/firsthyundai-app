name: Update Public Data (FREE)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_trades.py'
      - 'tests/test_pipeline.py'
      - '.github/workflows/collect.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행할 수집 (all/news/trades)'
        required: true
        default: all
        type: choice
        options: [all, news, trades]
  schedule:
    - cron: '17 */3 * * *'
    - cron: '41 19 * * *'
permissions:
  contents: write
concurrency:
  group: firsthyundai-public-collector
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run collector unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect RSS and create topic briefs
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'news') || github.event.schedule == '17 */3 * * *' }}
        run: python scripts/collect_news.py
      - name: Collect official apartment transactions
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'trades') || github.event.schedule == '41 19 * * *' || github.event_name == 'push' }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python scripts/collect_trades.py --months 12
      - name: Publish refreshed JSON only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json data/trades.json data/new_trades.json
          if git diff --staged --quiet; then
            echo 'No data updates.'
            exit 0
          fi
          git commit -m 'data: refresh public Songdo briefing snapshots'
          git push
