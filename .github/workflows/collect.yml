name: Update Public Data (FREE)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_trades.py'
      - 'scripts/collect_news.py'
      - 'scripts/summarize_news.py'
      - 'scripts/news_intelligence.py'
      - 'scripts/groq_news.py'
      - 'tests/test_news_gemini.py'
      - 'tests/test_news_intelligence.py'
      - 'tests/test_groq_news.py'
      - 'tests/test_pipeline.py'
      - '.github/workflows/collect.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행할 수집 (all/news/trades)'
        required: true
        default: all
        type: choice
        options: [all, news, trades]
  schedule:
    - cron: '17 */3 * * *'
    - cron: '41 19 * * *'
permissions:
  contents: write
concurrency:
  group: firsthyundai-public-collector
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run collector unit tests
        run: python -m unittest discover -s tests -v
      - name: Retain previous news summaries for safe reuse
        run: cp data/news.json /tmp/firsthyundai-previous-news.json
      - name: Collect RSS and create topic briefs
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'news') || github.event.schedule == '17 */3 * * *' || github.event_name == 'push' }}
        run: python scripts/collect_news.py
      - name: Install pinned Google News publisher URL resolver
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'news') || github.event.schedule == '17 */3 * * *' || github.event_name == 'push' }}
        run: |
          echo 'gnews-decoder==0.1.1 --hash=sha256:2d591a6bbb70eade4d1e6da3bc6660294ef6d394119f26283df1d1d7df97796c' > /tmp/firsthyundai-news-deps.txt
          python -m pip install 'requests==2.32.5'
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r /tmp/firsthyundai-news-deps.txt
      - name: Enrich article text with Gemini and free-tier Groq fallback
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'news') || github.event.schedule == '17 */3 * * *' || github.event_name == 'push' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/summarize_news.py --previous /tmp/firsthyundai-previous-news.json
      - name: Collect official apartment transactions
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'trades') || github.event.schedule == '41 19 * * *' }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python scripts/collect_trades.py --months 12
      - name: Publish refreshed JSON without conflicting rebases
        run: |
          set -e
          mapfile -t changed < <(git diff --name-only -- data/news.json data/trades.json data/new_trades.json)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo 'No data updates.'
            exit 0
          fi
          stage_dir=$(mktemp -d)
          for file in "${changed[@]}"; do
            mkdir -p "$stage_dir/$(dirname "$file")"
            cp "$file" "$stage_dir/$file"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve newly generated files across main branch updates.
          # Rebase would conflict when another collector has updated the same JSON.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            for file in "${changed[@]}"; do
              if [ "$file" = 'data/news.json' ]; then
                if python3 - "$file" "$stage_dir/$file" <<'PY'
          import json,sys
          from datetime import datetime
          try:
              old=json.load(open(sys.argv[1],encoding='utf-8'))['checked_at']
              new=json.load(open(sys.argv[2],encoding='utf-8'))['checked_at']
              older=datetime.fromisoformat(old)>=datetime.fromisoformat(new)
          except (ValueError,KeyError,FileNotFoundError,TypeError):
              older=False
          sys.exit(0 if older else 1)
          PY
                then
                  echo 'Remote news snapshot is newer; preserving its data.'
                  continue
                fi
              fi
              cp "$stage_dir/$file" "$file"
            done
            git add -- data/news.json data/trades.json data/new_trades.json
            if git diff --staged --quiet; then
              echo 'No newer data to publish.'
              exit 0
            fi
            git commit -m 'data: refresh public Songdo briefing snapshots'
            if git push origin HEAD:main; then
              echo 'Published refreshed snapshots successfully.'
              exit 0
            fi
            echo "Remote changed; retrying publish ($attempt/4)"
            sleep 3
          done
          echo 'Failed to publish data after four conflict-safe attempts.'
          exit 1
