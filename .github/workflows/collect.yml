name: Update Public Data (FREE)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_trades.py'
      - 'scripts/collect_news.py'
      - 'scripts/summarize_news.py'
      - 'tests/test_news_gemini.py'
      - 'tests/test_pipeline.py'
      - '.github/workflows/collect.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행할 수집 (all/news/trades)'
        required: true
        default: all
        type: choice
        options: [all, news, trades]
  schedule:
    - cron: '17 */3 * * *'
    - cron: '41 19 * * *'
permissions:
  contents: write
concurrency:
  group: firsthyundai-public-collector
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run collector unit tests
        run: python -m unittest discover -s tests -v
      - name: Retain previous news summaries for safe reuse
        run: cp data/news.json /tmp/firsthyundai-previous-news.json
      - name: Collect RSS and create topic briefs
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'news') || github.event.schedule == '17 */3 * * *' || github.event_name == 'push' }}
        run: python scripts/collect_news.py
      - name: Enrich verified article text with Gemini (optional, capped)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'news') || github.event.schedule == '17 */3 * * *' || github.event_name == 'push' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/summarize_news.py --previous /tmp/firsthyundai-previous-news.json
      - name: Collect official apartment transactions
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'all' || inputs.mode == 'trades') || github.event.schedule == '41 19 * * *' || github.event_name == 'push' }}
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python scripts/collect_trades.py --months 12
      - name: Publish refreshed JSON only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json data/trades.json data/new_trades.json
          if git diff --staged --quiet; then
            echo 'No data updates.'
            exit 0
          fi
          git commit -m 'data: refresh public Songdo briefing snapshots'
          # 변경 사항 수집 도중 저장소 코드가 갱신될 수 있으므로
          # 원격 브랜치로 재정렬해 데이터 커밋을 안전하게 업로드.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Remote changed; retrying publish (${attempt}/3)"
            sleep 3
          done
          echo 'Publishing refreshed data failed after retries.'
          exit 1
