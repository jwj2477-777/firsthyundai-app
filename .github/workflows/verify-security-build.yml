name: Verify Secure Android Build
on:
  push:
    paths:
      - '.github/workflows/verify-security-build.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate compile-only test verifier
        env:
          FIRSTHYUNDAI_ACCESS_CODE: 'OnlyTest!7394'
        run: python3 scripts/generate_app_lock.py
      - name: Verify APK compiles (no release)
        run: gradle --no-daemon assembleDebug
