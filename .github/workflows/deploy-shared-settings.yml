name: Deploy Shared Office Settings
# Re-apply already-registered Firebase GitHub Secrets to the existing Worker.
# This documentation-only change intentionally triggers the push deployment.
on:
  push:
    paths:
      - 'workers/shared-settings/**'
      - '.github/workflows/deploy-shared-settings.yml'
      - 'scripts/setup_shared_settings_kv.py'
      - 'scripts/check_shared_settings_health.py'
  workflow_run:
    workflows: ['Publish Administrator Access Policy', 'Publish Family Access Code Policy']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firsthyundai-shared-settings
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
      && (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare and admin secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIRSTHYUNDAI_ADMIN_CODE: ${{ secrets.FIRSTHYUNDAI_ADMIN_CODE }}
          FIRSTHYUNDAI_ACCESS_CODE: ${{ secrets.FIRSTHYUNDAI_ACCESS_CODE }}
        run: |
          for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FIRSTHYUNDAI_ADMIN_CODE FIRSTHYUNDAI_ACCESS_CODE; do
            if [ -z "${!n}" ]; then echo "::error::Missing required private secret: $n"; exit 1; fi
          done
      - name: Bind persistent shared-settings KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/setup_shared_settings_kv.py
      - name: Deploy settings Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config workers/shared-settings/wrangler.toml
      - name: Install private admin verifier secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIRSTHYUNDAI_ADMIN_CODE: ${{ secrets.FIRSTHYUNDAI_ADMIN_CODE }}
          FIRSTHYUNDAI_ACCESS_CODE: ${{ secrets.FIRSTHYUNDAI_ACCESS_CODE }}
        run: printf '%s' "$FIRSTHYUNDAI_ADMIN_CODE" | npx --yes wrangler@4 secret put FIRSTHYUNDAI_ADMIN_CODE --config workers/shared-settings/wrangler.toml
      - name: Install private general-mode board verifier secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIRSTHYUNDAI_ACCESS_CODE: ${{ secrets.FIRSTHYUNDAI_ACCESS_CODE }}
        run: printf '%s' "$FIRSTHYUNDAI_ACCESS_CODE" | npx --yes wrangler@4 secret put FIRSTHYUNDAI_ACCESS_CODE --config workers/shared-settings/wrangler.toml
      - name: Install optional private Firebase service-account credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FHD_FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FHD_FCM_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$FHD_FCM_SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$FHD_FCM_SERVICE_ACCOUNT_JSON" | npx --yes wrangler@4 secret put FHD_FCM_SERVICE_ACCOUNT_JSON --config workers/shared-settings/wrangler.toml
          else
            echo "Firebase service account not configured; periodic office note checking remains active."
          fi
      - name: Install optional public Firebase Android project configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FHD_FIREBASE_ANDROID_JSON: ${{ secrets.FHD_FIREBASE_ANDROID_JSON }}
        run: |
          if [ -n "$FHD_FIREBASE_ANDROID_JSON" ]; then
            printf '%s' "$FHD_FIREBASE_ANDROID_JSON" | npx --yes wrangler@4 secret put FHD_FIREBASE_ANDROID_JSON --config workers/shared-settings/wrangler.toml
          else
            echo "Firebase Android client config not yet registered; app may obtain it after server setup."
          fi
      - name: Connect optional official Songdo weather for themes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ -n "$DATA_GO_KR_SERVICE_KEY" ]; then
            printf '%s' "$DATA_GO_KR_SERVICE_KEY" | npx --yes wrangler@4 secret put DATA_GO_KR_SERVICE_KEY --config workers/shared-settings/wrangler.toml
          fi
      - name: Check official weather availability without credentials in logs
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python3 - <<'PYCODE'
          import json, urllib.request, urllib.error
          try:
              with urllib.request.urlopen('https://firsthyundai-shared-settings.jwj2477.workers.dev/theme-weather',timeout=20) as r:
                  w=json.load(r)
              assert w.get('status')=='ok'
              print('SONGDO_WEATHER_VERIFIED',w['effect'],w['observed_at'])
          except Exception:
              print('SONGDO_WEATHER_PENDING: checking provider permission without exposing the key.')
              import os, datetime, urllib.parse
              secret=urllib.parse.unquote(os.environ.get('DATA_GO_KR_SERVICE_KEY','').strip())
              if secret:
                  kst=datetime.timezone(datetime.timedelta(hours=9))
                  base=datetime.datetime.now(kst)-datetime.timedelta(minutes=40)
                  query=urllib.parse.urlencode(dict(serviceKey=secret,pageNo=1,numOfRows=20,dataType='JSON',base_date=base.strftime('%Y%m%d'),base_time=base.strftime('%H')+'00',nx=55,ny=123))
                  try:
                      with urllib.request.urlopen('https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtNcst?'+query,timeout=15) as provider:
                          data=json.load(provider)
                      code=str(data.get('response',{}).get('header',{}).get('resultCode','unknown'))
                      print('KMA_PERMISSION_RESULT_CODE',code if code.isdigit() else 'unknown')
                  except urllib.error.HTTPError as exc:
                      print('KMA_PROVIDER_HTTP_STATUS',exc.code)
                      import xml.etree.ElementTree as ET, re
                      try:
                          error=ET.fromstring(exc.read())
                          code=error.findtext('.//returnReasonCode') or ''
                          name=error.findtext('.//returnAuthMsg') or ''
                          if code.isdigit(): print('KMA_PROVIDER_REASON_CODE',code)
                          if re.fullmatch(r'[A-Z_ ]{3,80}',name): print('KMA_PROVIDER_REASON',name)
                      except Exception: pass
                  except Exception:
                      print('KMA_PROVIDER_UNAVAILABLE_OR_NON_JSON')
          PYCODE
      - name: Check today's official hourly weather briefing
        run: |
          python3 - <<'PYCODE'
          import json, urllib.request
          try:
              with urllib.request.urlopen('https://firsthyundai-shared-settings.jwj2477.workers.dev/weather-briefing',timeout=20) as r:
                  w=json.load(r)
              assert w.get('status')=='ok' and w.get('hours')
              print('SONGDO_FORECAST_VERIFIED',w['date'],w['issued_at'],len(w['hours']))
          except Exception:
              print('SONGDO_FORECAST_PENDING: official forecast access not verified; no rain/snow forecast is invented.')
          PYCODE
      - name: Verify Worker ready
        run: python3 scripts/check_shared_settings_health.py


