name: Verify Kakao Key Rotation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-kakao-key.yml'
      - 'data/nearby_config.json'
      - 'workers/kakao-nearby/wrangler.toml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Probe GitHub Kakao secret and deployed Cloudflare API (no secret logging)
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,sys,urllib.request,urllib.error,urllib.parse
          timeout=12
          def get(url,headers=None):
              try:
                  req=urllib.request.Request(url,headers=headers or {})
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      body=r.read(250_000);return r.status,json.loads(body)
              except urllib.error.HTTPError as e:
                  try: body=json.loads(e.read(6000))
                  except Exception: body={}
                  return e.code,body
              except Exception:
                  return 0,{}
          secret=os.environ.get('KAKAO_REST_API_KEY','').strip()
          ok=True
          if not secret:
              print('GITHUB_SECRET: MISSING (KAKAO_REST_API_KEY)')
              ok=False
          else:
              q=urllib.parse.urlencode({'query':'송도','size':1})
              status,body=get('https://dapi.kakao.com/v2/local/search/keyword.json?'+q,
                  {'Authorization':'KakaoAK '+secret,'Accept':'application/json'})
              good=status==200 and isinstance(body.get('documents'),list)
              print('GITHUB_SECRET_DIRECT_KAKAO: HTTP',status,'OK' if good else 'FAILED')
              if not good:ok=False
          config=json.load(open('data/nearby_config.json',encoding='utf-8'))
          base=str(config.get('backend_url','')).rstrip('/')
          if config.get('state')!='ready' or not base.startswith('https://') or not base.endswith('.workers.dev'):
              print('WORKER_CONFIG: MISSING_OR_NOT_READY');ok=False
          else:
              status,health=get(base+'/health')
              healthy=status==200 and health.get('ok') is True and health.get('ready') is True
              print('CLOUDFLARE_HEALTH: HTTP',status,'ready=',health.get('ready') if status==200 else 'unknown')
              if not healthy:ok=False
              status,nearby=get(base+'/nearby/f13/HP8')
              nearby_ok=status==200 and nearby.get('source')=='Kakao Local' and isinstance(nearby.get('places'),list)
              print('CLOUDFLARE_LIVE_KAKAO: HTTP',status,'OK' if nearby_ok else 'FAILED',
                    'stage=',str(nearby.get('stage',''))[:35],
                    'reason=',str(nearby.get('reason',''))[:45])
              if not nearby_ok:ok=False
          print('KAKAO_ROTATION_CHECK:', 'PASS' if ok else 'FAIL')
          sys.exit(0 if ok else 1)
          PY
