name: Sync Optional Public Services (requires approvals)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Select approved service only'
        required: true
        default: schools
        type: choice
        options: [schools, offices, office_sales, subscriptions, buildings, maintenance, complexinfo, all]
  push:
    branches: [main]
    paths:
      - 'scripts/collect_public_services.py'
      - 'scripts/collect_school_locations.py'
      - 'scripts/collect_registry_maintenance.py'
      - 'tests/test_public_services.py'
      - '.github/workflows/sync-public-services.yml'
  schedule:
    - cron: '32 21 2 * *' # monthly school update
    - cron: '12 23 * * *' # daily Applyhome + officetel updates, 08:12 KST
    - cron: '15 21 15 * *' # monthly approved registry / fee items, 06:15 KST
permissions:
  contents: write
concurrency:
  group: firsthyundai-extra-public
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate provider parse and no-fake-data safeguards
        run: python -m unittest discover -s tests -v
      - name: Collect only approved official services
        env:
          NEIS_EDU_KEY: ${{ secrets.NEIS_EDU_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "32 21 2 * *" ]; then
              python scripts/collect_public_services.py --mode schools
            elif [ "${{ github.event.schedule }}" = "15 21 15 * *" ]; then
              python scripts/collect_public_services.py --mode complexinfo
            else
              python scripts/collect_public_services.py --mode subscriptions
              if ! python scripts/collect_public_services.py --mode offices; then
                echo "Officetel rent API unavailable; preserve previous data."
              fi
              if ! python scripts/collect_public_services.py --mode office_sales; then
                echo "Officetel sale API separate approval pending; preserve previous data."
              fi
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            # When this collector changes, immediately recheck both official sources
            # with its secret (never expose the key or publish partial results).
            if ! python scripts/collect_public_services.py --mode schools; then
              echo "School refresh unavailable; preserving prior schools and continuing independent building/fee refresh."
            fi
            python scripts/collect_public_services.py --mode complexinfo
            if ! python scripts/collect_public_services.py --mode offices; then
              echo "Officetel rent API unavailable; keeping previously published records."
            fi
            if ! python scripts/collect_public_services.py --mode office_sales; then
              echo "Officetel sale API approval pending; never overwrite last verified records."
            fi
          else
            python scripts/collect_public_services.py --mode "${{ inputs.mode }}"
          fi
      - name: Commit only verified public snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/public_services.json
          if git diff --staged --quiet; then
            echo 'No approved source or unchanged data'; exit 0
          fi
          git commit -m 'data: update verified official optional public data'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
