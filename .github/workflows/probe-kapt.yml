name: Probe approved K-apt API (safe one-time check)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose fee benchmark (public data, key never printed)
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: python3 scripts/probe_fee_calibration.py
