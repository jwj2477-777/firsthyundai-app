name: Probe approved K-apt API (safe one-time check)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-kapt.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose upstream public-data network without transmitting service key
        run: |
          python - <<'PY'
          import socket, urllib.request, urllib.error, concurrent.futures
          host='apis.data.go.kr'
          try:
              addrs={i[4][0] for i in socket.getaddrinfo(host,443)}
              print('Gateway DNS:',len(addrs),'IP(s)')
          except Exception as exc:
              print('Gateway DNS error:',type(exc).__name__)
          paths=[
            'https://apis.data.go.kr/1613000/AptListService4/getSigunguAptList4',
            'https://apis.data.go.kr/1613000/AptListService4/getSidoAptList4',
            'http://apis.data.go.kr/1613000/AptListService4/getSigunguAptList4',
            'https://www.data.go.kr/data/15057332/openapi.do'
          ]
          def check(url):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'FirstHyundai-Diagnostics/1.0'})
                  with urllib.request.urlopen(req,timeout=9) as r:
                      return (url.split('/')[0]+'//'+url.split('/')[2],r.status,len(r.read(512)),'OK')
              except urllib.error.HTTPError as e:
                  return (url.split('/')[0]+'//'+url.split('/')[2],e.code,'http-error','reachable')
              except Exception as e:
                  return (url.split('/')[0]+'//'+url.split('/')[2],type(e).__name__,str(e)[:100],'failed')
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for url,x in zip(paths,pool.map(check,paths)):
                  print(url.split('/')[-1],x)
          PY
