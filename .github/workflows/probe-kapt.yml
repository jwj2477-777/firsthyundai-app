name: Probe approved K-apt API (safe one-time check)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-kapt.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare authorized trade API with newly approved K-apt APIs without disclosing secret
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os, concurrent.futures, urllib.request, urllib.error
          from urllib.parse import urlencode, unquote
          key=os.environ.get('DATA_GO_KR_SERVICE_KEY','').strip()
          if not key: raise RuntimeError('No existing public-data key configured')
          key=unquote(key)
          tests=[
           ('existing_trade','https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev',{'LAWD_CD':'28185','DEAL_YMD':'202608','numOfRows':1,'pageNo':1}),
           ('approved_apt_list','https://apis.data.go.kr/1613000/AptListService4/getSigunguAptList4',{'sigunguCode':'28185','numOfRows':1,'pageNo':1,'_type':'json'}),
           ('approved_provincial_list','https://apis.data.go.kr/1613000/AptListService4/getSidoAptList4',{'sidoCode':'28','numOfRows':1,'pageNo':1,'_type':'json'})]
          def check(row):
           label,url,params=row
           req=urllib.request.Request(url+'?'+urlencode({'serviceKey':key,**params}),headers={'User-Agent':'FirstHyundai-Kapt-Probe/1.0'})
           try:
            with urllib.request.urlopen(req,timeout=13) as res:
             payload=res.read(2000)
             return label,'http',res.status,'bytes',len(payload),'type',res.headers.get('Content-Type','unknown')[:80]
           except urllib.error.HTTPError as ex:
            return label,'HTTP',ex.code,'message redacted'
           except Exception as ex:
            return label,type(ex).__name__,str(ex)[:140]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
           for result in pool.map(check,tests): print(result,flush=True)
          PY
