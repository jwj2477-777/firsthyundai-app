name: Probe approved K-apt API (safe one-time check)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-kapt.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate real K-apt codes and one complete official profile
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os
          from scripts import collect_complexes as k
          key=os.environ.get('DATA_GO_KR_SERVICE_KEY','')
          response=k.call_api(k.LIST_URL,{'sigunguCode':'28185','pageNo':1,'numOfRows':10,'_type':'json'},key)
          env=response.get('response',response)
          print('K-apt list resultCode:',env.get('header',{}).get('resultCode','missing'),flush=True)
          rows,total=k.unpack(response)
          print('Decoded K-apt listing count:',len(rows),'declared total:',total,flush=True)
          if not rows: raise RuntimeError('K-apt listing contained no apartment records')
          print('Public listing keys:',sorted(rows[0].keys()),flush=True)
          code=next((str(row.get('kaptCode','')) for row in rows if str(row.get('kaptCode','')).startswith('A')),None)
          if not code: raise RuntimeError('K-apt list item lacks official complex code')
          basic=k.base_item(key,code)
          if not basic: raise RuntimeError('Basic info service returned no apartment')
          print('Public basic keys:',sorted(basic.keys()),flush=True)
          detail=k.detail_item(key,code)
          print('Public detail keys:',sorted(detail.keys()),flush=True)
          print('K-apt LIST+BASIC+DETAIL genuinely decoded successfully')
          PY
