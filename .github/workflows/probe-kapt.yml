name: Probe approved K-apt API (safe one-time check)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-kapt.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm current K-apt V5 basic and detail responses
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os
          from scripts import collect_complexes as k
          key=os.environ.get('DATA_GO_KR_SERVICE_KEY')
          listing=k.call_api(k.LIST_URL,{'sigunguCode':'28185','numOfRows':10,'pageNo':1,'_type':'json'},key)
          rows,total=k.unpack(listing)
          if not rows: raise RuntimeError('No K-apt list rows')
          code=rows[0]['kaptCode']
          print('K-apt list verified:',len(rows),'rows of',total,flush=True)
          for typ,old_url in [('basic',k.BASIC_URL),('detail',k.DETAIL_URL)]:
              url=old_url.replace('V4','V5')
              obj=k.call_api(url,{'kaptCode':code,'dataType':'JSON'},key)
              header=obj.get('response',obj).get('header',{})
              items,count=k.unpack(obj)
              print(typ,'V5 resultCode',header.get('resultCode'),'items',len(items),'keys',sorted(items[0]) if items else [],flush=True)
              if not items: raise RuntimeError(typ+' V5 API has no result')
          print('AUTHENTICATED K-apt LIST+BASIC+DETAIL V5 OK',flush=True)
          PY
