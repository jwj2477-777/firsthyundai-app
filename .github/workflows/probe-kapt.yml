name: Probe approved K-apt API (safe one-time check)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-kapt.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit Yeonsu apartment listing coverage and Songdo code filters
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os,collections
          from scripts import collect_complexes as k
          key=os.environ['DATA_GO_KR_SERVICE_KEY']
          data=k.call_api(k.LIST_URL,{'sigunguCode':'28185','numOfRows':500,'pageNo':1,'_type':'json'},key)
          rows,total=k.unpack(data)
          codes=collections.Counter(str(x.get('bjdCode','')) for x in rows)
          print('K-apt district listing rows',len(rows),'declared',total,flush=True)
          print('Legal-dong code distribution',codes.most_common(25),flush=True)
          filtered=[x for x in rows if str(x.get('bjdCode','')).startswith('28185106')]
          print('Songdo legal code prefix matches',len(filtered),'exact10digit',sum(str(x.get('bjdCode',''))=='2818510600' for x in filtered),flush=True)
          print('Sample matching names/codes',[(x.get('kaptName'),x.get('bjdCode')) for x in filtered[:20]],flush=True)
          print('Other Songdo-named complexes',[(x.get('kaptName'),x.get('bjdCode')) for x in rows if '송도' in str(x.get('kaptName')) and x not in filtered][:18],flush=True)
          PY
