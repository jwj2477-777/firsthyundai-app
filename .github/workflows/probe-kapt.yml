name: Probe approved K-apt API (safe one-time check)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-kapt.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Identify missing K-apt Songdo basic-info mapping rules
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python - <<'PY'
          import os,concurrent.futures
          from scripts import collect_complexes as k
          key=os.environ['DATA_GO_KR_SERVICE_KEY']
          data=k.call_api(k.LIST_URL,{'sigunguCode':'28185','numOfRows':500,'pageNo':1,'_type':'json'},key)
          rows,_=k.unpack(data)
          selected=[r for r in rows if r.get('bjdCode')==k.SONGDO_CODE][:18]
          def inspect(rec):
              try:
                  b=k.base_item(key,rec['kaptCode'])
                  if not b:return (rec.get('kaptName'),'EMPTY BASIC')
                  p=k.apt_profile(b,{},'2026-10-19')
                  return (rec.get('kaptName'), 'VALID' if p else 'EXCLUDED',
                      str(b.get('bjdCode')), str(b.get('kaptAddr'))[:48],
                      str(b.get('doroJuso'))[:48],str(b.get('kaptdaCnt')),str(b.get('hoCnt')),str(b.get('kaptDongCnt')))
              except Exception as e:return (rec.get('kaptName'),type(e).__name__,str(e)[:100])
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              for i in pool.map(inspect,selected):print(i,flush=True)
          PY
