name: Publish FirstHyundai v1.9.2 Download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-apk-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'jwj2477-777/firsthyundai-app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve already-tested successful Android APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39265487934 --repo "$GITHUB_REPOSITORY" --name FirstHyundai-Free-Auto-APK --dir artifact
          test -s artifact/app-debug.apk
          cp artifact/app-debug.apk FirstHyundai-v1.9.2.apk
          unzip -t FirstHyundai-v1.9.2.apk | grep 'No errors detected'
          sha256sum FirstHyundai-v1.9.2.apk
      - name: Publish publicly downloadable release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.9.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.9.2 FirstHyundai-v1.9.2.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.9.2 FirstHyundai-v1.9.2.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title '퍼스트현대 v1.9.2' \
              --notes '센트럴파크푸르지오를 기존 K-apt 데이터에 연결해 관심 14개 단지로 확대. 프라임뷰20·25 및 더샵센트럴파크3차는 각각 독립 유지. FHD FIRST 앱 아이콘의 Android 안전영역 잘림 수정. 송도 전체 93개 개별 아파트 유지. GitHub Actions에서 테스트·빌드된 디버그 서명 APK입니다. 기존 앱 메모를 백업한 뒤 설치하세요.'
          fi
