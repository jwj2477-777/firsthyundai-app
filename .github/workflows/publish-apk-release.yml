name: Publish FirstHyundai v1.11.0 Download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-apk-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'jwj2477-777/firsthyundai-app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve already-tested successful Android APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39274334790 --repo "$GITHUB_REPOSITORY" --name FirstHyundai-Free-Auto-APK --dir artifact
          test -s artifact/app-debug.apk
          cp artifact/app-debug.apk FirstHyundai-v1.11.0.apk
          unzip -t FirstHyundai-v1.11.0.apk | grep 'No errors detected'
          sha256sum FirstHyundai-v1.11.0.apk
      - name: Publish publicly downloadable release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.11.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.11.0 FirstHyundai-v1.11.0.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.11.0 FirstHyundai-v1.11.0.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title '퍼스트현대 v1.11.0' \
              --notes '건축물대장·공동주택 관리비·도로명주소·학교 학군·오피스텔 전월세·청약 분양정보의 공식 신청처와 연동 상태를 필요한 상세 화면에 통합. NEIS 학교 기본정보 및 국토부 오피스텔 전월세는 별도 승인 후 자동 수집 가능. 미승인 데이터는 0원·0건으로 오표시하지 않음. 기존 관심14개·송도93개 단지 유지. GitHub Actions에서 테스트·빌드된 디버그 서명 APK입니다. 기존 앱 메모를 백업한 뒤 설치하세요.'
          fi
