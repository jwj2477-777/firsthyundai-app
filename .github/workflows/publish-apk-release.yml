name: Publish FirstHyundai v1.10.0 Download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-apk-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'jwj2477-777/firsthyundai-app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve already-tested successful Android APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39267805558 --repo "$GITHUB_REPOSITORY" --name FirstHyundai-Free-Auto-APK --dir artifact
          test -s artifact/app-debug.apk
          cp artifact/app-debug.apk FirstHyundai-v1.10.0.apk
          unzip -t FirstHyundai-v1.10.0.apk | grep 'No errors detected'
          sha256sum FirstHyundai-v1.10.0.apk
      - name: Publish publicly downloadable release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.10.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.10.0 FirstHyundai-v1.10.0.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.10.0 FirstHyundai-v1.10.0.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title '퍼스트현대 v1.10.0' \
              --notes '아파트정보·즐겨찾기에서 단지를 누르면 0.24초 부드러운 슬라이드 상세화면으로 전환. 큰 뒤로가기와 안드로이드 뒤로가기 키를 지원하며 기존 목록 검색·스크롤 위치 보존. 14개 즐겨찾기와 93개 송도 단지정보 그대로 유지. GitHub Actions에서 테스트·빌드된 디버그 서명 APK입니다. 기존 앱 메모를 백업한 뒤 설치하세요.'
          fi
