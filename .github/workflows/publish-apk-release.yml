name: Publish FirstHyundai v1.9.1 Download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-apk-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'jwj2477-777/firsthyundai-app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve already-tested successful Android APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39263624338 --repo "$GITHUB_REPOSITORY" --name FirstHyundai-Free-Auto-APK --dir artifact
          test -s artifact/app-debug.apk
          cp artifact/app-debug.apk FirstHyundai-v1.9.1.apk
          unzip -t FirstHyundai-v1.9.1.apk | grep 'No errors detected'
          sha256sum FirstHyundai-v1.9.1.apk
      - name: Publish publicly downloadable release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.9.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.9.1 FirstHyundai-v1.9.1.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.9.1 FirstHyundai-v1.9.1.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title '퍼스트현대 v1.9.1' \
              --notes '네이버페이 부동산 화면 5장 대조. 엑스포10·아리스타 주소, 이안송도 주차257·관리전화, 월드메르디앙 4개동·주차145 보강. 가족용 기본정보에서 용적률·건폐율 제거. 기존 93개 개별 단지 유지. GitHub Actions에서 테스트·빌드된 디버그 서명 APK입니다. 기존 앱 메모를 백업한 뒤 설치하세요.'
          fi
