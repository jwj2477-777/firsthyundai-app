name: Publish FirstHyundai v1.8.0 Download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-apk-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'jwj2477-777/firsthyundai-app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve already-tested successful Android APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39257076813 --repo "$GITHUB_REPOSITORY" --name FirstHyundai-Free-Auto-APK --dir artifact
          test -s artifact/app-debug.apk
          cp artifact/app-debug.apk FirstHyundai-v1.8.0.apk
          unzip -t FirstHyundai-v1.8.0.apk | grep 'No errors detected'
          sha256sum FirstHyundai-v1.8.0.apk
      - name: Publish publicly downloadable release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.8.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.8.0 FirstHyundai-v1.8.0.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.8.0 FirstHyundai-v1.8.0.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title '퍼스트현대 v1.8.0' \
              --notes '부모님용 3대 메뉴, 13개 즐겨찾기 완전 분리, 큰 실거래 선택 버튼, 매매 파랑·전세 초록·월세 주황 및 계약해제 빨간색. 송도 공식 77개 단지정보 유지. GitHub Actions에서 테스트·빌드된 디버그 서명 APK입니다. 기존 앱 메모를 백업한 뒤 설치하세요.'
          fi
