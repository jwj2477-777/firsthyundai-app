name: Publish FirstHyundai v1.10.1 Download
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-apk-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'jwj2477-777/firsthyundai-app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve already-tested successful Android APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39269709206 --repo "$GITHUB_REPOSITORY" --name FirstHyundai-Free-Auto-APK --dir artifact
          test -s artifact/app-debug.apk
          cp artifact/app-debug.apk FirstHyundai-v1.10.1.apk
          unzip -t FirstHyundai-v1.10.1.apk | grep 'No errors detected'
          sha256sum FirstHyundai-v1.10.1.apk
      - name: Publish publicly downloadable release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.10.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.10.1 FirstHyundai-v1.10.1.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.10.1 FirstHyundai-v1.10.1.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title '퍼스트현대 v1.10.1' \
              --notes '실거래·새 거래·뉴스·단지정보 갱신 시 GitHub의 최신 게시 데이터를 캐시 없이 다시 확인하고 반영 여부·마지막 수집 시각·연결 오류를 명확히 표시. 제목 앞 FHD FIRST 마크 추가, 중복 안내문 삭제. 14개 즐겨찾기와 93개 개별 단지 유지. GitHub Actions에서 테스트·빌드된 디버그 서명 APK입니다. 기존 앱 메모를 백업한 뒤 설치하세요.'
          fi
