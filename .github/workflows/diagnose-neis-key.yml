name: NEIS Key Safe Verification (no secrets displayed)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_neis_key.py'
      - '.github/workflows/diagnose-neis-key.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify diagnostic code
        run: python -m py_compile scripts/diagnose_neis_key.py
      - name: Check saved secret format and compare NEIS authentication responses
        env:
          NEIS_EDU_KEY: ${{ secrets.NEIS_EDU_KEY }}
        run: python scripts/diagnose_neis_key.py
