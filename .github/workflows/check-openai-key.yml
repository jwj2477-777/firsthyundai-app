name: Check OpenAI API Connection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-openai-key.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify OPENAI_API_KEY with Responses API without exposing token
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,sys
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          key=os.environ.get("OPENAI_API_KEY","").strip()
          if not key:
              print("FAIL: OPENAI_API_KEY secret not found")
              sys.exit(1)
          body=json.dumps({"model":"gpt-4.1-mini","input":"한국어로 확인이라고만 답하세요.","max_output_tokens":50,"store":False}).encode()
          req=Request("https://api.openai.com/v1/responses",data=body,headers={"Authorization":"Bearer "+key,"Content-Type":"application/json"},method="POST")
          try:
              with urlopen(req,timeout=28) as r:
                  data=json.loads(r.read(30000))
              text="".join(part.get("text","") for output in data.get("output",[]) if output.get("type")=="message" for part in output.get("content",[]) if part.get("type")=="output_text")
              print("OpenAI Response status:",data.get("status","unknown"),"text_characters:",len(text))
              if data.get("status")!="completed" or not text.strip():
                  raise RuntimeError("No completed text response")
          except HTTPError as e:
              body=e.read(3000)
              try:
                  err=json.loads(body).get("error",{})
                  print("FAIL: OpenAI API HTTP",e.code,"error_code:",err.get("code","unknown"),"error_type:",err.get("type","unknown"))
              except (ValueError,TypeError,AttributeError):
                  print("FAIL: OpenAI API HTTP",e.code,"without error details")
              sys.exit(1)
          except (OSError,ValueError,RuntimeError) as e:
              print("FAIL: OpenAI API connection",type(e).__name__)
              sys.exit(1)
          PY
