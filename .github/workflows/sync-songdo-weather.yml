name: Sync Official Songdo Weather
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_songdo_weather.mjs'
      - '.github/workflows/sync-songdo-weather.yml'
  schedule:
    - cron: '11,31,51 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: firsthyundai-public-songdo-weather
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate official weather delivery fallback
        run: node scripts/test_weather_snapshot.mjs
      - name: Collect official observed and hourly forecast weather
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: node scripts/collect_songdo_weather.mjs
      - name: Publish only validated public weather
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/songdo_weather.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: refresh official Songdo observed weather and hourly forecast'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify app weather delivery after publishing
        run: |
          python3 - <<'PY'
          import json,urllib.request
          root='https://firsthyundai-shared-settings.jwj2477.workers.dev'
          for route in ['theme-weather','weather-briefing']:
              try:
                  with urllib.request.urlopen(urllib.request.Request(root+'/'+route,headers={'User-Agent':'Mozilla/5.0 (Linux; Android 17; FirstHyundai/2.0)','Accept':'application/json'}),timeout=20) as stream:
                      value=json.load(stream)
                  assert value.get('status')=='ok'
                  print('APP_WEATHER_DELIVERY_VERIFIED',route,value.get('observed_at') or value.get('issued_at'),value.get('transport','direct'))
              except Exception:
                  print('APP_WEATHER_DELIVERY_PENDING',route,'snapshot published; Worker deployment/cache may still be updating')
          PY
