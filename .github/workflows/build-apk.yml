  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'data/complexes.json'
      - 'scripts/test_family_mode.js'
      - 'scripts/test_complexes.js'
      - 'scripts/test_catalog_editor.js'
      - 'scripts/test_complex_discovery.js'
      - 'scripts/test_simplified_complex_ui.js'
      - 'scripts/test_complex_facts.js'
      - 'scripts/test_area_contract_bridge.js'
      - 'scripts/test_contract_parent_review.js'
      - 'scripts/test_contract_required_date.js'
      - 'scripts/test_supply_pyeong.js'
      - 'scripts/test_extended_complex_catalog.js'
      - 'scripts/test_naver_basic_facts.js'
      - 'scripts/test_nearby.js'
      - 'scripts/test_compact_complex_cards.js'
      - 'scripts/test_favorite_trade_count_buttons.js'
      - 'scripts/test_favorite_trade_alerts.js'
      - 'scripts/test_android_trade_notifications.js'
      - 'scripts/test_mobile_navigation.js'
      - 'scripts/test_new_trade_clarity.js'
      - 'scripts/test_navigation_clarity.js'
      - 'scripts/test_unified_top_layout.js'
      - 'scripts/test_page_title_parity.js'
      - 'scripts/test_segmented_switch_unity.js'
      - 'scripts/test_selection_flow.js'
      - 'scripts/test_premium_visual.js'
      - 'scripts/test_android_insets_presentation.js'
      - 'scripts/test_screenshot_consistency.js'
      - 'scripts/test_cross_screen_polish.js'
      - 'scripts/test_apartment_detail_tabs_polish.js'
      - 'scripts/test_workflow_pilot.js'
      - 'scripts/test_officetel_heading_color.js'
      - 'scripts/test_office_on_demand.js'
      - 'scripts/test_public_hub.js'
      - 'scripts/test_family_accessibility.js'
      - 'scripts/test_maintenance_trends.js'
      - 'scripts/test_contracts.js'
      - 'scripts/test_contract_language.js'
      - 'scripts/test_contract_easy.js'
      - 'scripts/test_contract_guided_flow.js'
      - 'scripts/test_contract_proposal_template.js'
      - 'scripts/test_contract_broker.js'
      - 'scripts/test_contract_transfer.js'
      - 'scripts/test_contract_image.js'
      - 'scripts/test_trade_contract_regression.js'
      - 'scripts/test_trade_contract_date_filter.js'
      - 'scripts/test_trade_confirmation_states.js'
      - 'scripts/test_app_version.js'
      - 'scripts/test_updates_welcome.js'
      - 'scripts/test_update_fallback.js'
      - 'scripts/publish_app_release_index.py'
      - 'tests/test_release_index.py'
      - 'scripts/check_apk_version.py'
      - 'scripts/test_apartment_detail_navigation.js'
      - 'scripts/test_refresh_feedback.js'
      - 'scripts/test_public_hub.js'
      - 'scripts/test_news_ai_ui.js'
      - 'scripts/test_kakao_nearby.mjs'
      - 'data/nearby_config.json'
      - 'scripts/collect_public_services.py'
      - 'scripts/collect_school_locations.py'
      - 'tests/test_public_services.py'
      - 'tests/test_school_locations.py'
      - 'tests/test_school_csv_snapshot.py'
      - 'scripts/import_school_locations_csv.py'
      - 'data/public_services.json'
      - 'scripts/generate_launcher_icon.py'
      - 'scripts/test_launcher_safezone.py'
      - 'scripts/collect_complexes.py'
      - 'tests/test_complex_pipeline.py'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test K-apt API parsing, authorization and Songdo-only source matching
        run: python -m unittest discover -s tests -v
      - name: Verify official school-location API access (optional, no credentials in logs)
        if: github.event_name == 'pull_request'
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts')
          from collect_school_locations import collect
          try:
              data=collect(os.environ.get('DATA_GO_KR_SERVICE_KEY',''),page_size=1000)
              print('OFFICIAL_SCHOOL_FALLBACK_VERIFIED:',len(data['records']))
          except RuntimeError as e:
              print('OFFICIAL_SCHOOL_FALLBACK_PENDING:',str(e)[:150])
          PY
      - name: Validate published Songdo K-apt catalog and source identities
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/complexes.json').read_text(encoding='utf-8'))
          rows=data['records']
          assert len(rows)>=13
          ids=[row['id'] for row in rows]
          assert len(ids)==len(set(ids)), 'Duplicated catalog identifiers'
          curated=[x for x in rows if x.get('catalog_source')!='kapt']
          official=[x for x in rows if x.get('catalog_source')=='kapt']
          assert len(curated)>=13, 'All original thirteen verified estates must survive'
          favorites={'f13','f14','f15','m21','m22','m23','avenue','centennial','prime20','prime25','skcentral','artwin','central3'}
          assert len([x for x in curated if x['id'] in favorites])==13
          assert all(str(x.get('kapt_code','')).startswith('A') and x.get('households',0)>0 for x in official)
          print('Verified published apartment data:',len(rows),'total,',len(official),'additional K-apt registered complexes')
          PY
      - name: Validate in-app JavaScript syntax
        run: |
          python3 -c "from pathlib import Path; x=Path('app/src/main/assets/index.html').read_text(encoding='utf-8'); Path('/tmp/firsthyundai-ui.js').write_text(x.split('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')"
          node --check /tmp/firsthyundai-ui.js
          node scripts/test_premium_motion.js
          node scripts/test_selection_flow.js
          node scripts/test_shared_brand_handoff.js
          node scripts/test_price_trends.js
          node scripts/test_nearby.js
          node scripts/test_compact_complex_cards.js
          node scripts/test_favorite_trade_count_buttons.js
          node --check app/src/main/assets/trade-alerts.js
          node scripts/test_favorite_trade_alerts.js
          node scripts/test_android_trade_notifications.js
          node scripts/test_new_trade_clarity.js
          node scripts/test_mobile_navigation.js
          node --check app/src/main/assets/contracts.js
          node --check app/src/main/assets/contracts-smart.js
          node scripts/test_contracts.js
          node --check app/src/main/assets/contracts-language.js
          node scripts/test_contract_language.js
          node --check app/src/main/assets/contracts-easy.js
          node scripts/test_contract_easy.js
          node scripts/test_contract_parent_review.js
          node scripts/test_contract_required_date.js
          node scripts/test_contract_memo_ui.js
          node scripts/test_contract_guided_flow.js
          node scripts/test_contract_proposal_template.js
          node scripts/test_family_accessibility.js
          node scripts/test_family_plain_ui.js
          node scripts/test_color_input_roles.js
          node scripts/test_navigation_clarity.js
          node scripts/test_unified_top_layout.js
          node scripts/test_page_title_parity.js
          node scripts/test_segmented_switch_unity.js
          node scripts/test_ui_v2.js
          node scripts/test_premium_visual.js
          node scripts/test_android_insets_presentation.js
          node scripts/test_screenshot_consistency.js
          node scripts/test_cross_screen_polish.js
          node scripts/test_apartment_detail_tabs_polish.js
          node scripts/test_workflow_pilot.js
          node scripts/test_officetel_heading_color.js
          node scripts/test_scroll_to_top.js
          node scripts/test_contract_broker.js
          node --check app/src/main/assets/contracts-transfer.js
          node scripts/test_contract_transfer.js
          node --check app/src/main/assets/contract-image.js
          node scripts/test_contract_image.js
          node scripts/test_trade_contract_regression.js
          node scripts/test_trade_contract_date_filter.js
          node scripts/test_trade_confirmation_states.js
          node scripts/test_app_version.js
          node scripts/test_updates_welcome.js
          node scripts/test_direct_updater.js
          node scripts/test_update_fallback.js
          node scripts/test_apartment_detail_navigation.js
          node scripts/test_area_contract_bridge.js
          node scripts/test_refresh_feedback.js
          node scripts/test_maintenance_trends.js
          node scripts/test_public_hub.js
          node scripts/test_office_on_demand.js
          node scripts/test_news_ai_ui.js
          node scripts/test_kakao_nearby.mjs
          node scripts/test_family_mode.js
          node scripts/test_admin_guards.js
          node scripts/test_complexes.js
          node scripts/test_catalog_editor.js
          node scripts/test_complex_discovery.js
          node scripts/test_simplified_complex_ui.js
          node scripts/test_complex_facts.js
          node scripts/test_supply_pyeong.js
          node scripts/test_extended_complex_catalog.js
          node scripts/test_naver_basic_facts.js
      - name: Test password policy generation (disposable code)
        run: python3 scripts/test_family_policy.py
      - name: Test independent administrator policy
        run: python3 scripts/test_admin_policy.py
      - name: Generate FHD office launcher icon
        run: python3 scripts/generate_launcher_icon.py
      - name: Assert launcher safe zone and branded text not cropped
        run: python3 scripts/test_launcher_safezone.py
      - name: Test native update parser and stale-feed selection
        run: gradle --no-daemon testDebugUnitTest
      - name: Prepare immutable release signing key (release builds only)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          FHD_SIGNING_BUNDLE_B64: ${{ secrets.FHD_SIGNING_BUNDLE_B64 }}
        run: |
          python3 - <<'PY'
          import os,sys,base64,io,zipfile
          from pathlib import Path
          bundle=os.environ.get('FHD_SIGNING_BUNDLE_B64','').strip()
          if not bundle:
              raise SystemExit('Production signing secret FHD_SIGNING_BUNDLE_B64 is missing. Refusing rotating debug-signature APK release.')
          try:
              archive=zipfile.ZipFile(io.BytesIO(base64.b64decode(bundle,validate=True)))
              if set(archive.namelist())!={'firsthyundai-upload-keystore.p12','signing.properties'}:
                  raise ValueError('Unrecognized signing bundle format')
              keystore=Path(os.environ['RUNNER_TEMP'])/'firsthyundai-upload-keystore.p12'
              keystore.write_bytes(archive.read('firsthyundai-upload-keystore.p12'))
              os.chmod(keystore,0o600)
              lines=archive.read('signing.properties').decode().splitlines()
              secrets=dict(line.split('=',1) for line in lines if '=' in line)
              required=('FHD_SIGNING_STORE_PASSWORD','FHD_SIGNING_KEY_ALIAS','FHD_SIGNING_KEY_PASSWORD')
              if any(not secrets.get(x) for x in required):raise ValueError('Signing bundle credentials missing')
              with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as stream:
                  stream.write('FHD_SIGNING_KEYSTORE='+str(keystore)+'\n')
                  for key in required:stream.write(key+'='+secrets[key]+'\n')
              print('Persistent release keystore loaded from encrypted GitHub Secret')
          except Exception as exc:
              raise SystemExit('Signing bundle invalid; update release blocked') from None
          PY
      - name: Build APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gradle --no-daemon assembleDebug
          else
            gradle --no-daemon assembleRelease
          fi
      - name: Exercise release signing with disposable PR key (not a public release)
        if: github.event_name == 'pull_request'
        run: |
          keytool -genkeypair -noprompt -alias disposable-ci-only -keyalg RSA -keysize 2048 -keystore "$RUNNER_TEMP/disposable-ci-only.p12" -storetype PKCS12 -validity 1 -storepass "DISPOSABLE_CI_ONLY_2026" -keypass "DISPOSABLE_CI_ONLY_2026" -dname "CN=Disposable PR Build, O=Not For Distribution, C=KR" >/dev/null 2>&1
          export FHD_SIGNING_KEYSTORE="$RUNNER_TEMP/disposable-ci-only.p12"
          export FHD_SIGNING_STORE_PASSWORD="DISPOSABLE_CI_ONLY_2026"
          export FHD_SIGNING_KEY_ALIAS="disposable-ci-only"
          export FHD_SIGNING_KEY_PASSWORD="DISPOSABLE_CI_ONLY_2026"
          gradle --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          rm -rf app/build/outputs/apk/release "$RUNNER_TEMP/disposable-ci-only.p12"
      - name: Verify APK version and immutable release signing identity
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check_apk_version.py app/build/outputs/apk/debug/app-debug.apk
          else
            python3 scripts/check_apk_version.py app/build/outputs/apk/release/app-release.apk
            python3 scripts/check_release_signature.py app/build/outputs/apk/release/app-release.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FirstHyundai-Free-Auto-APK
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish v2.0.72 unified section typography APK
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk FirstHyundai-v2.0.72.apk
          unzip -t FirstHyundai-v2.0.72.apk | grep 'No errors detected'
          if gh release view v2.0.72 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; preserving the published APK."
            exit 1
          else
            gh release create v2.0.72 FirstHyundai-v2.0.72.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title '퍼스트현대 v2.0.72 · 동급 제목·설명 글자 크기 통일' \
              --notes '뉴스·아파트정보·아파트 실거래·오피스텔 실거래·관심단지·새거래의 동급 페이지 제목/메타 글자 크기·굵기·줄간격을 공통 CSS 규칙으로 통일했습니다. 과거 실거래에만 남아 있던 13px 우선순위 규칙과 아파트·오피스텔만 22px로 키우던 덮어쓰기를 제거했습니다. 제목 20px(좁은 화면 19px), 설명 14px, 2줄 여백을 동일하게 설정했습니다. 실거래 최신 수집정보, 뉴스 기사 수, 실패 정보와 새 물 흐르는 버튼 색상 애니메이션은 유지합니다. 여섯 화면을 검사하는 회귀 테스트 추가. v2.0.72/build123.'
          fi
          python3 scripts/export_ai_handoff.py --out dist/ai-handoff
          gh release upload v2.0.72 dist/ai-handoff/FirstHyundai-AI-Handoff-Complete.md dist/ai-handoff/FirstHyundai-AI-Handoff-Complete.zip --repo "$GITHUB_REPOSITORY"
          python3 scripts/publish_app_release_index.py --tag v2.0.72 --apk FirstHyundai-v2.0.72.apk
